# Render blueprint: builds the Dockerfile and runs it as an always-on web service.
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: gridwise
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BACKUP_BASE_URL
        sync: false
      - key: LLM_BACKUP_API_KEY
        sync: false
      - key: LLM_BACKUP_MODEL
        sync: false
